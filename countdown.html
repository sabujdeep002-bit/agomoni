<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agomoni Countdown</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:transparent;
}

body{
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  color:#fff;
}

/* ================================
   COUNTDOWN
   ================================ */

.countdown{
  width:100%;
  max-width:680px;
  margin:0 auto;
  padding:8px 10px 10px;
  text-align:center;
}

.countdown h2{
  margin:0 0 2px;
  font-size:clamp(22px,4.5vw,32px);
  line-height:1.15;
  font-weight:800;
  text-shadow:0 3px 12px rgba(0,0,0,.45);
}

.countdown p{
  margin:0 0 10px;
  font-size:clamp(11px,2.2vw,14px);
  line-height:1.3;
  opacity:.9;
  text-shadow:0 2px 8px rgba(0,0,0,.4);
}

/* ================================
   TIME BOXES
   ================================ */

.units{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  width:100%;
}

.unit{
  min-width:0;
  height:78px;
  padding:9px 4px 6px;

  border:1px solid rgba(255,255,255,.22);
  border-radius:12px;

  background:rgba(255,255,255,.10);

  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);

  box-shadow:
    0 5px 18px rgba(0,0,0,.12),
    inset 0 1px 0 rgba(255,255,255,.12);
}

.number{
  display:block;

  font-size:clamp(27px,6vw,43px);
  line-height:1;

  font-weight:900;

  text-shadow:
    0 3px 10px rgba(0,0,0,.35);
}

.label{
  display:block;

  margin-top:5px;

  font-size:9px;
  line-height:1;

  letter-spacing:1.2px;
  font-weight:700;

  opacity:.78;
}

/* ================================
   FINISHED
   ================================ */

#done{
  display:none;

  padding:14px;

  font-size:22px;
  font-weight:800;

  text-shadow:0 3px 12px rgba(0,0,0,.45);
}


/* ================================
   MOBILE
   ================================ */

@media(max-width:480px){

  .countdown{
    padding:6px 7px 8px;
  }

  .countdown h2{
    font-size:24px;
    margin-bottom:2px;
  }

  .countdown p{
    font-size:11px;
    margin-bottom:8px;
  }

  .units{
    gap:5px;
  }

  .unit{
    height:70px;
    padding:8px 3px 5px;
    border-radius:10px;
  }

  .number{
    font-size:28px;
  }

  .label{
    margin-top:4px;
    font-size:8px;
    letter-spacing:.9px;
  }
}


/* ================================
   VERY SMALL MOBILE
   ================================ */

@media(max-width:360px){

  .countdown h2{
    font-size:21px;
  }

  .countdown p{
    font-size:10px;
  }

  .unit{
    height:64px;
  }

  .number{
    font-size:25px;
  }

  .label{
    font-size:7px;
  }
}
</style>
</head>


<body>

<section class="countdown" aria-live="polite">

  <h2>মা আসছেন আর...</h2>

  <p>
    শুভ মহাষষ্ঠী — ১৬ অক্টোবর ২০২৬
  </p>

  <div class="units" id="units">

    <div class="unit">
      <span class="number" id="days">00</span>
      <span class="label">DAY</span>
    </div>

    <div class="unit">
      <span class="number" id="hours">00</span>
      <span class="label">HOUR</span>
    </div>

    <div class="unit">
      <span class="number" id="minutes">00</span>
      <span class="label">MIN</span>
    </div>

    <div class="unit">
      <span class="number" id="seconds">00</span>
      <span class="label">SEC</span>
    </div>

  </div>

  <div id="done">
    শুভ মহাষষ্ঠী! 🌺
  </div>

</section>


<script>
(() => {

  const target =
    new Date("2026-10-16T00:00:00+05:30").getTime();

  const $ = id =>
    document.getElementById(id);

  const pad = n =>
    String(n).padStart(2,"0");


  function update(){

    const diff =
      target - Date.now();


    if(diff <= 0){

      $("units").style.display = "none";

      $("done").style.display = "block";

      return;
    }


    const days =
      Math.floor(diff / 86400000);

    const hours =
      Math.floor(diff / 3600000) % 24;

    const minutes =
      Math.floor(diff / 60000) % 60;

    const seconds =
      Math.floor(diff / 1000) % 60;


    $("days").textContent =
      days;

    $("hours").textContent =
      pad(hours);

    $("minutes").textContent =
      pad(minutes);

    $("seconds").textContent =
      pad(seconds);

  }


  update();

  setInterval(update,1000);

})();
</script>

</body>
</html>
