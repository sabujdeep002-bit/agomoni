<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agomoni Countdown</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:transparent;
}

body{
  font-family:
    system-ui,
    -apple-system,
    "Segoe UI",
    sans-serif;

  color:#fff;
}


/* ================================
   COUNTDOWN CONTAINER
   ================================ */

.countdown{

  width:100%;
  max-width:620px;

  margin:0 auto;

  padding:5px 8px;

  text-align:center;
}


/* ================================
   TITLE
   ================================ */

.countdown h2{

  margin:0 0 2px;

  font-size:
    clamp(20px,4vw,28px);

  line-height:1.1;

  font-weight:800;

  color:#fff;

  text-shadow:
    0 2px 10px rgba(0,0,0,.45);
}


/* ================================
   DATE TEXT
   ================================ */

.countdown p{

  margin:0 0 7px;

  font-size:11px;

  line-height:1.2;

  color:#fff;

  opacity:.9;

  text-shadow:
    0 1px 6px rgba(0,0,0,.4);
}


/* ================================
   FOUR BOXES
   ================================ */

.units{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:6px;

  width:100%;
}


/* ================================
   EACH BOX
   ================================ */

.unit{

  min-width:0;

  padding:8px 5px;

  border:1px solid
    rgba(255,255,255,.22);

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.06)
    );

  backdrop-filter:blur(7px);

  -webkit-backdrop-filter:blur(7px);

  box-shadow:
    0 5px 15px rgba(0,0,0,.12),

    inset 0 1px 0
    rgba(255,255,255,.12);
}


/* ================================
   NUMBER
   ================================ */

.number{

  display:block;

  font-size:
    clamp(24px,5vw,38px);

  line-height:1;

  font-weight:900;

  color:#fff;

  text-shadow:
    0 2px 8px rgba(0,0,0,.3);
}


/* ================================
   DAY / HOUR / MIN / SEC
   ================================ */

.label{

  display:block;

  margin-top:4px;

  font-size:8px;

  line-height:1;

  letter-spacing:1px;

  font-weight:700;

  color:#fff;

  opacity:.8;
}


/* ================================
   PUJA COMPLETE
   ================================ */

#done{

  display:none;

  padding:10px;

  font-size:22px;

  font-weight:800;

  color:#fff;

  text-shadow:
    0 2px 10px rgba(0,0,0,.5);
}


/* ================================
   MOBILE
   ================================ */

@media(max-width:480px){

  .countdown{

    padding:3px 5px;

  }

  .countdown h2{

    font-size:21px;

  }

  .countdown p{

    font-size:9px;

    margin-bottom:5px;

  }

  .units{

    gap:4px;

  }

  .unit{

    padding:7px 3px;

    border-radius:10px;

  }

  .number{

    font-size:27px;

  }

  .label{

    font-size:7px;

    margin-top:3px;

    letter-spacing:.8px;

  }

}


/* ================================
   VERY SMALL MOBILE
   ================================ */

@media(max-width:350px){

  .countdown h2{

    font-size:19px;

  }

  .countdown p{

    font-size:8px;

  }

  .number{

    font-size:24px;

  }

  .label{

    font-size:6px;

  }

}

</style>
</head>


<body>


<section
  class="countdown"
  aria-live="polite"
>

  <h2>
    মা আসছেন আর...
  </h2>


  <p>
    শুভ মহাষষ্ঠী — ১৬ অক্টোবর ২০২৬
  </p>


  <div
    class="units"
    id="units"
  >

    <div class="unit">

      <span
        class="number"
        id="days"
      >
        00
      </span>

      <span class="label">
        DAY
      </span>

    </div>


    <div class="unit">

      <span
        class="number"
        id="hours"
      >
        00
      </span>

      <span class="label">
        HOUR
      </span>

    </div>


    <div class="unit">

      <span
        class="number"
        id="minutes"
      >
        00
      </span>

      <span class="label">
        MIN
      </span>

    </div>


    <div class="unit">

      <span
        class="number"
        id="seconds"
      >
        00
      </span>

      <span class="label">
        SEC
      </span>

    </div>

  </div>


  <div id="done">
    শুভ মহাষষ্ঠী! 🌺
  </div>

</section>



<script>

(() => {


  /*
   * ================================
   * PUJA COUNTDOWN DATE
   * 16 OCTOBER 2026
   * India Time — GMT +5:30
   * ================================
   */

  const target =
    new Date(
      "2026-10-16T00:00:00+05:30"
    ).getTime();


  const days =
    document.getElementById("days");

  const hours =
    document.getElementById("hours");

  const minutes =
    document.getElementById("minutes");

  const seconds =
    document.getElementById("seconds");

  const units =
    document.getElementById("units");

  const done =
    document.getElementById("done");


  function pad(number){

    return String(number)
      .padStart(2,"0");

  }


  function updateCountdown(){

    const now =
      Date.now();

    const difference =
      target - now;


    /*
     * Puja date reached
     */

    if(difference <= 0){

      units.style.display =
        "none";

      done.style.display =
        "block";

      return;

    }


    /*
     * Calculate days
     */

    const d =
      Math.floor(
        difference /
        (1000 * 60 * 60 * 24)
      );


    /*
     * Calculate hours
     */

    const h =
      Math.floor(
        (difference %
          (1000 * 60 * 60 * 24))
        /
        (1000 * 60 * 60)
      );


    /*
     * Calculate minutes
     */

    const m =
      Math.floor(
        (difference %
          (1000 * 60 * 60))
        /
        (1000 * 60)
      );


    /*
     * Calculate seconds
     */

    const s =
      Math.floor(
        (difference %
          (1000 * 60))
        /
        1000
      );


    /*
     * Update screen
     */

    days.textContent =
      d;

    hours.textContent =
      pad(h);

    minutes.textContent =
      pad(m);

    seconds.textContent =
      pad(s);

  }


  /*
   * First update immediately
   */

  updateCountdown();


  /*
   * Update every second
   */

  setInterval(
    updateCountdown,
    1000
  );


})();

</script>

</body>
</html>
